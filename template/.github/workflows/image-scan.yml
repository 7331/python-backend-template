name: Image scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan
  cancel-in-progress: false

jobs:
  backend-image:
    name: Backend image — Trivy
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      IMAGE_TAG: image-scan-backend:run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the backend image
        run: docker buildx build --load --file backend/Dockerfile --tag "$IMAGE_TAG" .
      - name: Scan for fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: What to do when this fails
        if: failure()
        run: echo "::notice::The backend image has a fixable HIGH or CRITICAL vulnerability. For an OS package, move APT_EPOCH in backend/Dockerfile to today. For a Python package, upgrade it in backend/uv.lock. Then deploy."
      - name: Remove this run's image
        if: always()
        run: docker image rm --force "$IMAGE_TAG"
